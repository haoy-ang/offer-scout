spring:
  application:
    name: offer-scout
  profiles:
    # 默认本地开发：加载 application-local.yml（含真实密钥，已 gitignore，不入库）。
    # CI 用环境变量 SPRING_PROFILES_ACTIVE=ci 覆盖，改加载 src/test/resources/application-ci.yml，
    # 里面只有 localhost 的 MySQL/Redis 与占位密钥 —— 流水线因此不需要任何真实 secret。
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      # 简历上传的体积上限。必须显式配：Spring Boot 默认 max-file-size 只有 1MB，
      # 而真实简历 PDF 常在 1~2MB —— 不配的话用户传个正常简历就会失败，
      # 且抛出的 MaxUploadSizeExceededException 默认没人接，前端只会看到框架的报错结构。
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8124
  servlet:
    context-path: /api

# ─────────────────────────────────────────────────────────────
# 业务自定义配置
# ─────────────────────────────────────────────────────────────
offer-scout:
  agent:
    # Agent 异步任务专用线程池（见 AgentExecutorConfig）。
    # 不用 ForkJoinPool.commonPool：那是全局公共池，并行度只有 CPU-1，
    # 阻塞型长任务会把它占死，连带饿死 parallelStream 等其他使用者。
    executor:
      core-size: 4
      max-size: 8
      # 有界队列是刻意的：无界队列会把 OOM 风险藏起来，满了就该明确拒绝（返回 429）
      queue-capacity: 32
      keep-alive-seconds: 60
  ratelimit:
    # ⚠️ 安全开关，默认必须是 false。
    # X-Forwarded-For 是客户端可以随便写的请求头 —— 信任它等于把限流开关交给攻击者。
    # false：只认 TCP 连接的对端地址（单机 / 直连部署的唯一正确选择）
    # true ：确实部署在可信代理之后，且代理用【覆盖】方式写入该头：
    #        proxy_set_header X-Forwarded-For $remote_addr;
    #        用 $proxy_add_x_forwarded_for（追加）时第一段仍是伪造值，开了等于没开。
    trust-forwarded-headers: false
  vector-store:
    # SimpleVectorStore 的落盘缓存目录。变更知识库素材会改变缓存 key 并触发全量重建。
    cache-dir: ./.vector-cache
  rag:
    # RAG 检索相似度阈值（0.0 ~ 1.0）。依据 RagEvaluationRunnerTest 实测（50 条：
    # 素材题 30 / 自由问 15 / 超纲 5，本地跑 95s）：
    #   0.00~0.50 → 四个指标完全不变，阈值形同虚设；素材里没有的话题照样被硬塞 4 个不相关片段
    #   0.55      → 正样本命中 93.3% 不变，超纲题拒答 20%，平均片段 4.00→3.70（省 7.5% 上下文）
    #   0.60      → 超纲题全部拒答，但正样本命中开始掉（88.9%，空召回 6.7%）
    #   0.65      → 命中跌到 75.6%，不能接受
    # 取 0.55：无损前提下唯一能白拿的收益点（拒答 + 省 token）。
    # 改素材或换 embedding 模型后要重跑扫表，别沿用这个数。
    similarity-threshold: 0.55

    # 断言校验（CitationChecker）：把回答里"资料中查不到出处"的百分比/量化指标/配置项标出来，
    # 追在回答末尾提醒用户换成自己的实测值。
    # 默认开。跑答案质量评测（RagAnswerQualityEvalTest）时会显式关掉 ——
    # 否则 judge 看到的是"自带免责声明"的回答，分数会被提示本身抬高，测不出生成质量的真实变化。
    citation-audit-enabled: true

# 接口文档（Knife4j）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.haoy.offerscout.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

# 说明：Spring AI 的 DEBUG 日志（能看到发给大模型的完整提示词）**刻意不放在这里**，
# 而是放在 application-local.yml —— 因为它会把用户简历正文、JD 原文、面试对话全文
# 一并写进日志，属于隐私泄漏 + 日志噪音，只应在本地调试时开。
