# =====================================================================
# CI 专用配置（GitHub Actions）
#
# 为什么要单独一份？
#   application-local.yml 含真实密钥、且被 gitignore —— CI checkout 拿不到它，
#   于是上下文会因为「没有数据源 / 模型配置」直接起不来。所以这里放一份
#   「只连 localhost、只用占位密钥」的等价配置，随代码入库。里面没有任何真实 secret。
#
# 怎么生效？
#   application.yml 里 spring.profiles.active = ${SPRING_PROFILES_ACTIVE:local}；
#   流水线设环境变量 SPRING_PROFILES_ACTIVE=ci 即可切到本文件。
#   本文件放在 src/test/resources —— 只在跑测试时上 classpath，不会进打包产物。
#
# 依赖的 service container（见 .github/workflows/ci.yml）：
#   MySQL 8  @ localhost:3306（root / root）、Redis @ localhost:6379
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/offer_scout?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 同本地：DDL 全写成 IF NOT EXISTS，每次启动跑一遍是幂等的
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  ai:
    dashscope:
      # 占位密钥（不是真的，也调不通）：Spring AI 只在「为空」时报 "API key must be set"，
      # 填个非空值就能通过装配校验。真去调接口会 401，但 JobVectorStoreConfig 对向量化
      # 失败做了兜底（catch 后不抛出，只降级 RAG），所以上下文照常启动。
      # 而真正调用大模型的测试都打了 @Tag("requires-ai")，CI 已用 -DexcludedGroups 排除。
      api-key: ci-placeholder-not-a-real-key
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3
    chat:
      memory:
        repository:
          jdbc:
            # 同本地：Spring AI 1.0 没带 MySQL 建表脚本，建表交给 db/schema.sql
            initialize-schema: never

offerscout:
  jwt:
    # 非真实密钥，仅用于通过「HS256 要求至少 256 bit（32 字节）」的长度校验
    secret: ci-placeholder-jwt-secret-at-least-32-bytes-long
    expire-minutes: 720
    issuer: offer-scout
